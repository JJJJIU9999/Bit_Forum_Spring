spring:
  application:
    name: bit-forum-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bit_forum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  # 本地库已经手工建过表时，允许 Flyway 先建立历史表并接管现有 schema
  # 全新数据库仍会按 db/migration 下的 V1、V2... 脚本自动初始化
  flyway:
    baseline-on-migrate: true
  # ==================== Spring AI（M13 起） ====================
  ai:
    deepseek:
      # API Key 只从环境变量读取，绝不写入代码或提交到仓库。
      # 本地开发时由 .env 提供；Docker 部署时由 compose 透传。
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        # 与 datasource / rabbitmq / jwt 的约定保持一致：必需的凭据缺失时启动即失败，
        # 避免应用"看似正常启动、调用 AI 时才报错"。
        # 默认值沿用 Spring AI 的 true；测试环境在 src/test/resources/application.yml
        # 中显式设为 false，因为测试不应依赖真实 API Key。
        # 需要临时关闭 AI（例如演示降级链路）时，设置 DEEPSEEK_CHAT_ENABLED=false。
        enabled: ${DEEPSEEK_CHAT_ENABLED:true}
        options:
          # 使用 deepseek-flash（DeepSeek-V4.1-Flash）。
          # 旧模型名 deepseek-chat / deepseek-reasoner 已退役，服务端会自动映射到 flash，
          # 这里显式写正式名称，避免依赖隐式映射。
          #
          # 选 flash 而非 deepseek-v4-pro 的原因：flash 价格为 pro 的约 1/4.5
          # （输入未命中 1~2 元/百万 token vs 4.5~9 元；输出 4~8 元 vs 13.5~27 元），
          # 且同样支持 Tool Calls 与 JSON Output，满足 M14-M17 的工具调用与结构化输出需求。
          model: deepseek-flash
          temperature: 0.7
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000}

bitforum:
  article-metric-sync:
    fixed-delay: ${ARTICLE_METRIC_SYNC_FIXED_DELAY:300000}
    initial-delay: ${ARTICLE_METRIC_SYNC_INITIAL_DELAY:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      status:
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 503
