spring:
  application:
    name: bit-forum-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bit_forum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  flyway:
    baseline-on-migrate: true
  # ==================== Spring AI（M13 起） ====================
  ai:
    deepseek:
      # 测试环境提供占位 API Key。
      #
      # 原因：DeepSeekChatAutoConfiguration 只在类路径上有 DeepSeekApi 时生效，
      # 且其 deepSeekChatModel() 方法没有 @ConditionalOnProperty 条件，
      # 只要自动配置被加载就会无条件创建 bean 并校验 api-key 非空
      # （缺失时抛 IllegalArgumentException: DeepSeek API key must be set）。
      # 官方 starter 的 spring.ai.deepseek.chat.enabled 并不控制该 bean 的创建，
      # 因此这里必须给出一个非空占位值，Spring 上下文才能启动。
      #
      # 安全性：测试不会真正调用 DeepSeek 接口；需要验证 AI 逻辑的测试必须使用
      # Spring AI 的 Mock 聊天模型，而不是真实网络请求。
      api-key: test-placeholder-key-not-used-for-real-calls

jwt:
  secret: bit-forum-test-secret-minimum-32-bytes
  expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      status:
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 503
