spring:
  application:
    name: bit-forum-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bit_forum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  flyway:
    baseline-on-migrate: true
  # ==================== Spring AI（M13 起） ====================
  ai:
    deepseek:
      # 从环境变量读取真实 Key；没有配置时回退为占位符。
      # 占位符是必需的：DeepSeekChatAutoConfiguration 的 deepSeekChatModel()
      # 没有 @ConditionalOnProperty，只要 starter 在类路径上就会无条件创建 bean
      # 并校验 api-key 非空（缺失时抛 IllegalArgumentException），
      # 因此占位符保证常规测试的 Spring 上下文能正常启动。
      #
      # 注意不要写成硬编码字符串：那会覆盖环境变量传入的真实 Key，
      # 导致开启 DEEPSEEK_CHAT_ENABLED=true 做真实调用时认证失败（实测踩到，401）。
      api-key: ${DEEPSEEK_API_KEY:test-placeholder-key-not-used-for-real-calls}
      chat:
        # 默认关闭真实 AI 调用：常规测试不依赖网络与真实 Key。
        # 需要真实调用验证时（DeepSeekSmokeTest）用环境变量 DEEPSEEK_CHAT_ENABLED=true 打开。
        enabled: ${DEEPSEEK_CHAT_ENABLED:false}

jwt:
  secret: bit-forum-test-secret-minimum-32-bytes
  expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      status:
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 503
