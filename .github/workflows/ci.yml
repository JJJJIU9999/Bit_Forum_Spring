name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bit_forum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        # 必须用 Redis Stack：M15 的 RAG 向量检索依赖 RediSearch 模块（FT.* 命令），
        # 普通 redis:7-alpine 会在 RedisVectorStore 初始化时报
        # "ERR unknown command 'FT._LIST'"，导致整个 Spring 上下文启动失败。
        # 注意：该镜像没有 Entrypoint、Cmd 是 /entrypoint.sh，
        # 不要用 command 覆盖，否则模块不会加载（findings.md 5.1 踩过）。
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: bitforum
          RABBITMQ_DEFAULT_PASS: bitforum-ci-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_USERNAME: bitforum
      SPRING_RABBITMQ_PASSWORD: bitforum-ci-password
      JWT_SECRET: bit-forum-ci-secret-minimum-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # M15 起测试上下文会加载本地 ONNX 嵌入模型与 tokenizer（TransformersEmbeddingModel
      # 在类路径存在时无条件构建，无法用开关关闭，见 findings.md 6.8.1）。
      # 不缓存时每次 CI 都要从 HuggingFace 下载上百 MB，网络抖动会直接让上下文启动失败
      # （实测出现过 `Failed to cache the resource ... SocketException: Connection reset`）。
      - name: Cache ONNX embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bitforum-onnx
          # 模型标识与 application.yml 的 transformers 配置保持一致；换模型时改这里的 key
          key: bitforum-onnx-bge-base-zh-v1.5-quantized-v1
          restore-keys: |
            bitforum-onnx-bge-base-zh-v1.5-
      - name: Pre-download ONNX model with retry
        # 缓存未命中时先带重试地下载（比在 Spring 上下文启动阶段失败更可控、日志更清晰）；
        # 已命中缓存时这一步几乎瞬间完成（文件已存在则不重复下载）。
        run: |
          CACHE_DIR="$HOME/.cache/bitforum-onnx"
          mkdir -p "$CACHE_DIR"
          BASE="https://huggingface.co/Xenova/bge-base-zh-v1.5/resolve/main"
          for pair in "model_quantized.onnx:onnx/model_quantized.onnx" "tokenizer.json:tokenizer.json"; do
            FILE="${pair%%:*}"; REMOTE="${pair##*:}"
            if [ -s "$CACHE_DIR/$FILE" ]; then
              echo "已存在，跳过下载：$FILE"
              continue
            fi
            echo "下载 $REMOTE ..."
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$CACHE_DIR/$FILE" "$BASE/$REMOTE"
          done
          ls -la "$CACHE_DIR"
      - name: Run backend tests
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
